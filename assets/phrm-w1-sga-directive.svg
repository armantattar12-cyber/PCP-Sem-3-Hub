<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1370" viewBox="0 0 1400 1370">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#162230}.title{font-size:52px;font-weight:800;fill:#0b82c6}.kicker{font-size:24px;font-weight:700;fill:#687887}.h{font-size:29px;font-weight:800;fill:#0b82c6}.bar{fill:#064b70}.bartext{font-size:22px;font-weight:800;fill:#fff}.lab{font-size:20px;font-weight:800}.v{font-size:20px}.small{font-size:18px;fill:#334657}.row{fill:#c8e9f8}.white{fill:#fff}.line{stroke:#1b3140;stroke-width:2}.accent{stroke:#f06b2b;stroke-width:6;stroke-linecap:round}
</style>
<rect width="1400" height="1370" rx="28" fill="#fff"/>
<text x="70" y="86" class="kicker">ALS PCS • PHRM 208 Week 1</text>
<text x="70" y="154" class="title">Supraglottic Airway Medical Directive</text>
<line x1="70" y1="185" x2="1330" y2="185" class="accent"/>

<text x="70" y="245" class="h">Indications</text>
<text x="70" y="288" class="v">Need for ventilatory assistance or airway control</text>
<text x="70" y="329" class="lab">AND</text>
<text x="70" y="370" class="v">Other airway management is ineffective.</text>

<text x="70" y="445" class="h">Conditions</text>
<rect x="70" y="475" width="600" height="55" class="bar"/><text x="245" y="512" class="bartext">Supraglottic Airway</text>
<rect x="70" y="530" width="600" height="55" class="white"/><text x="90" y="566" class="lab">Age</text><text x="335" y="566" class="v">N/A</text>
<rect x="70" y="585" width="600" height="55" class="row"/><text x="90" y="621" class="lab">LOA</text><text x="335" y="621" class="v">N/A</text>
<rect x="70" y="640" width="600" height="55" class="white"/><text x="90" y="676" class="lab">HR / RR / SBP</text><text x="335" y="676" class="v">N/A</text>
<rect x="70" y="695" width="600" height="70" class="row"/><text x="90" y="738" class="lab">Other</text><text x="335" y="738" class="v">Absent gag reflex</text>

<text x="735" y="445" class="h">Contraindications</text>
<rect x="735" y="475" width="595" height="55" class="bar"/><text x="905" y="512" class="bartext">Supraglottic airway</text>
<text x="755" y="576" class="v">Airway obstructed by a foreign object</text>
<line x1="735" y1="598" x2="1330" y2="598" class="line"/>
<text x="755" y="640" class="v">Known esophageal disease (varices)</text>
<line x1="735" y1="662" x2="1330" y2="662" class="line"/>
<text x="755" y="704" class="v">Trauma to the oropharynx</text>
<line x1="735" y1="726" x2="1330" y2="726" class="line"/>
<text x="755" y="768" class="v">Caustic ingestion</text>
<line x1="735" y1="790" x2="1330" y2="790" class="line"/>

<text x="70" y="875" class="h">Treatment</text>
<rect x="70" y="905" width="1260" height="52" class="bar"/><text x="90" y="940" class="bartext">Consider supraglottic airway insertion</text>
<text x="90" y="994" class="v">The maximum number of supraglottic airway insertion attempts is 2.</text>

<rect x="70" y="1035" width="1260" height="52" class="bar"/><text x="90" y="1070" class="bartext">Confirm supraglottic airway placement</text>
<text x="90" y="1120" class="lab">Primary</text><text x="335" y="1120" class="v">ETCO₂ (waveform capnography)</text>
<text x="90" y="1163" class="lab">Secondary</text><text x="335" y="1163" class="v">ETCO₂ (non-waveform device) • auscultation • chest rise</text>

<text x="70" y="1245" class="h">Clinical considerations</text>
<text x="70" y="1286" class="small">An insertion attempt is defined as insertion of the supraglottic airway into the mouth.</text>
<text x="70" y="1322" class="small">Use waveform ETCO₂ for confirmation. If waveform capnography is unavailable/not working, use at least 2 secondary methods.</text>
</svg>