<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <rect width="1600" height="1120" rx="28" fill="#f7fbfd"/>
  <rect x="18" y="18" width="1564" height="1084" rx="24" fill="#ffffff" stroke="#dbe8ef" stroke-width="2"/>
  <foreignObject x="48" y="42" width="1504" height="1036">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,Helvetica,sans-serif;color:#14222d;height:100%;box-sizing:border-box;">
      <style>
        *{box-sizing:border-box}
        .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:6px solid #ef6d2e;padding:0 2px 22px;margin-bottom:24px}
        .kicker{font-size:18px;font-weight:800;letter-spacing:.08em;color:#667d8b;text-transform:uppercase;margin-bottom:8px}
        h1{font-size:42px;line-height:1.08;color:#0b82c6;margin:0;font-weight:850;letter-spacing:-.02em}
        .sub{font-size:18px;line-height:1.45;color:#617482;max-width:560px;text-align:right;margin-top:8px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        .panel{border:1px solid #d6e6ee;border-radius:18px;overflow:hidden;background:#fff}
        .panel h2{font-size:22px;line-height:1.2;margin:0;padding:13px 16px;background:#064b70;color:white;font-weight:850}
        .panel .p{padding:14px 16px}
        .panel p{font-size:18px;line-height:1.45;margin:0 0 8px}
        .panel p:last-child{margin-bottom:0}
        .row{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:9px 12px;font-size:17px;line-height:1.35;border-top:1px solid #e5eef3}
        .row:nth-child(even){background:#dff2fb}
        .row b{font-weight:850}
        .full{grid-column:1/-1}
        .alert h2{background:#8d0046}
        .soft{background:#f4f9fc}
        .bullets{margin:0;padding-left:22px}
        .bullets li{font-size:17px;line-height:1.45;margin:5px 0}
        .and{font-weight:900;color:#0b82c6}
        .footer{font-size:14px;color:#758895;margin-top:13px;text-align:right}
        .pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#e8f7fb;color:#08779c;font-size:13px;font-weight:850;margin-right:5px}
        .big{font-size:20px!important;line-height:1.5!important}
      </style>
      <div class="top"><div><div class="kicker">PHRM 208 • Week 1 • ALS PCS 5.4</div><h1>Medical Termination of Resuscitation (TOR)</h1></div><div class="sub">Clean lecture-sourced directive snapshot<br/>ALS PCS / lecture structure preserved</div></div>
      
<div class="grid">
  <section class="panel"><h2>Conditions — Medical TOR</h2>
    <div class="row"><b>Age</b><span>≥ 16 years</span></div>
    <div class="row"><b>LOA</b><span>Altered</span></div>
    <div class="row"><b>HR / RR / SBP</b><span>N/A</span></div>
    <div class="p">
      <p>Arrest not witnessed by paramedic</p><p class="and">AND</p>
      <p>No ROSC after <b>20 minutes</b> of resuscitation</p><p class="and">AND</p>
      <p>No defibrillation delivered</p>
    </div>
  </section>

  <section class="panel"><h2>Contraindications</h2><div class="p"><ul class="bullets">
    <li>Pregnancy presumed to be ≥ 20 weeks gestation</li>
    <li>Suspected hypothermia</li>
    <li>Airway obstruction</li>
    <li>Non-opioid drug overdose / toxicology</li>
  </ul></div></section>

  <section class="panel alert full"><h2>Mandatory Provincial Patch Point</h2><div class="p">
    <p class="big"><b>Patch to consider Medical TOR (if applicable).</b></p>
    <p>Patch early to consider TOR if there are extenuating circumstances or where the paramedic considers ongoing resuscitation to be futile.</p>
    <p>If the patch fails and/or there is no ROSC after 20 minutes of resuscitation, initiate transport.</p>
  </div></section>

  <section class="panel full"><h2>Lecture Considerations for TOR</h2><div class="p">
    <p>Age • ETCO₂ • bystander witnessed • bystander CPR • patient location • transportation time • egress/extrication time • prolonged transport • caregiver wishes • DNR confirmation form • underlying end-stage progressive illness • unusual cause such as electrocution, hanging or toxicology.</p>
    <p><b>Lecture note:</b> TOR might be granted even though contraindicated; patch order is for Withhold Resuscitation.</p>
  </div></section>
</div>
      <div class="footer">Study visual • verify current operational wording in the applicable ALS PCS / Companion Document.</div>
    </div>
  </foreignObject>
</svg>