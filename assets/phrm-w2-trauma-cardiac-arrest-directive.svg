<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" rx="28" fill="#f7fbfd"/>
  <rect x="18" y="18" width="1564" height="964" rx="24" fill="#ffffff" stroke="#dbe8ef" stroke-width="2"/>
  <foreignObject x="48" y="42" width="1504" height="916">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,Helvetica,sans-serif;color:#14222d;height:100%;box-sizing:border-box;">
      <style>
        *{box-sizing:border-box}
        .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:6px solid #ef6d2e;padding:0 2px 22px;margin-bottom:24px}
        .kicker{font-size:18px;font-weight:800;letter-spacing:.08em;color:#667d8b;text-transform:uppercase;margin-bottom:8px}
        h1{font-size:42px;line-height:1.08;color:#0b82c6;margin:0;font-weight:850;letter-spacing:-.02em}
        .sub{font-size:18px;line-height:1.45;color:#617482;max-width:560px;text-align:right;margin-top:8px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        .panel{border:1px solid #d6e6ee;border-radius:18px;overflow:hidden;background:#fff}
        .panel h2{font-size:22px;line-height:1.2;margin:0;padding:13px 16px;background:#064b70;color:white;font-weight:850}
        .panel .p{padding:14px 16px}
        .panel p{font-size:18px;line-height:1.45;margin:0 0 8px}
        .panel p:last-child{margin-bottom:0}
        .row{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:9px 12px;font-size:17px;line-height:1.35;border-top:1px solid #e5eef3}
        .row:nth-child(even){background:#dff2fb}
        .row b{font-weight:850}
        .full{grid-column:1/-1}
        .alert h2{background:#8d0046}
        .soft{background:#f4f9fc}
        .bullets{margin:0;padding-left:22px}
        .bullets li{font-size:17px;line-height:1.45;margin:5px 0}
        .and{font-weight:900;color:#0b82c6}
        .footer{font-size:14px;color:#758895;margin-top:13px;text-align:right}
        .pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#e8f7fb;color:#08779c;font-size:13px;font-weight:850;margin-right:5px}
        .big{font-size:20px!important;line-height:1.5!important}
      </style>
      <div class="top"><div><div class="kicker">PHRM 208 • Week 2 • ALS PCS 5.4</div><h1>Trauma Cardiac Arrest Medical Directive</h1></div><div class="sub">Clean lecture-sourced directive snapshot<br/>ALS PCS / lecture structure preserved</div></div>
      
<div class="grid">
  <section class="panel"><h2>Indication</h2><div class="p"><p class="big">Cardiac arrest secondary to severe blunt or penetrating trauma.</p></div>
    <div class="row"><b>CPR</b><span>Performed in 2-minute intervals</span></div>
    <div class="row"><b>LOA</b><span>Altered</span></div>
  </section>

  <section class="panel"><h2>Manual Defibrillation — Conditions</h2>
    <div class="row"><b>Age</b><span>≥ 24 hours</span></div>
    <div class="row"><b>LOA</b><span>Altered</span></div>
    <div class="row"><b>Rhythm</b><span>VF or pulseless VT</span></div>
    <div class="p"><p><b>Contraindication:</b> rhythms other than VF or pulseless VT.</p></div>
  </section>

  <section class="panel"><h2>Treatment</h2><div class="p">
    <p><b>CPR:</b> consider CPR as per current Heart and Stroke Foundation of Canada guidelines.</p>
    <p><b>Manual defibrillation:</b> consider if available and authorized.</p>
    <p><b>≥24 h to &lt;8 y:</b> 1 defibrillation at 2 J/kg.</p>
    <p><b>≥8 y:</b> 1 defibrillation; initial dose as per RBHP / manufacturer.</p>
  </div></section>

  <section class="panel"><h2>Clinical Considerations</h2><div class="p"><ul class="bullets">
    <li>If there are no obvious external signs of significant blunt trauma, consider medical cardiac arrest and use the appropriate directive.</li>
    <li>Signs of life listed in lecture: spontaneous movement, respiratory efforts, organized electrical activity on ECG, reactive pupils.</li>
  </ul></div></section>
</div>
      <div class="footer">Study visual • verify current operational wording in the applicable ALS PCS / Companion Document.</div>
    </div>
  </foreignObject>
</svg>