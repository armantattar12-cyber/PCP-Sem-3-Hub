<!doctype html>
<html lang="en">
<head>

<title>PCP Mastery Hub</title>
<meta name="description" content="A premium semester mastery dashboard for PCP study, active recall, weak spots and quizzes.">
<style>
:root{--bg:#06101c;--panel:#0c1928;--panel2:#102238;--line:#1c3850;--text:#f2f8fb;--muted:#91a7b9;--cyan:#49d8e7;--blue:#6da8ff;--green:#62e3a4;--amber:#ffc66d;--red:#ff7b8d;--purple:#b49dff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% -5%,rgba(73,216,231,.14),transparent 28rem),radial-gradient(circle at 100% 0,rgba(109,168,255,.12),transparent 30rem),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:18px 14px;background:rgba(6,16,28,.86);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:11px;padding:7px 8px 22px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:1px solid rgba(73,216,231,.3);background:linear-gradient(135deg,rgba(73,216,231,.16),rgba(109,168,255,.1));font-weight:1000;color:var(--cyan)}.brand strong{display:block}.brand small{color:var(--muted);font-size:10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:11px;font-weight:800}.nav button:hover,.nav button.on{background:rgba(73,216,231,.08);color:#e7fcff}.nav span{display:inline-block;width:25px}.sidefoot{position:absolute;left:14px;right:14px;bottom:15px;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.025)}.sidefoot b{font-size:10px}.sidefoot p{font-size:9px;color:var(--muted);line-height:1.5;margin:5px 0 0}
.top{height:70px;position:sticky;top:0;z-index:15;border-bottom:1px solid rgba(28,56,80,.75);background:rgba(6,16,28,.79);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.kicker{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan);font-weight:950}.pagetitle{font-size:17px;font-weight:900;margin-top:2px}.topright{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:850}.btn:hover{border-color:#315a77;transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#39cbdc,#5d96ff);border-color:transparent;color:#04101b}.btn.soft{background:rgba(73,216,231,.08);border-color:rgba(73,216,231,.25);color:#c8fbff}.btn.danger{background:rgba(255,123,141,.08);border-color:rgba(255,123,141,.22);color:#ffafb9}
.main{min-width:0}.wrap{max-width:1480px;margin:auto;padding:28px}.hero{position:relative;overflow:hidden;border:1px solid #204158;border-radius:27px;background:linear-gradient(135deg,rgba(73,216,231,.075),transparent 35%),linear-gradient(315deg,rgba(109,168,255,.085),transparent 37%),var(--panel);padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.26)}.hero:after{content:"";position:absolute;width:390px;height:390px;border-radius:50%;right:-140px;top:-155px;border:1px solid rgba(73,216,231,.08);box-shadow:0 0 0 55px rgba(73,216,231,.016),0 0 0 110px rgba(73,216,231,.01)}.heroGrid{display:grid;grid-template-columns:1.35fr .65fr;gap:20px;position:relative;z-index:2}.eyebrow{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:950}.hero h1{font-size:clamp(34px,4vw,58px);line-height:1;margin:10px 0 12px;letter-spacing:-.045em}.hero h1 em{font-style:normal;background:linear-gradient(90deg,#dffcff,#7ee4ef,#88adff);background-clip:text;color:transparent}.hero p{color:var(--muted);line-height:1.7;max-width:720px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.mission{border:1px solid var(--line);border-radius:18px;background:rgba(4,12,22,.55);padding:17px}.mission small{font-size:9px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.12em}.mission h3{font-size:19px;margin:7px 0}.mission p{font-size:10px;margin:0 0 12px}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin:16px 0}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(16,34,56,.9),rgba(11,25,41,.94));border-radius:18px}.stat{padding:16px}.stat label{display:block;color:var(--muted);font-size:10px;font-weight:800}.stat b{font-size:28px;display:block;margin:5px 0}.stat small{color:#667f93;font-size:9px}
.section{margin-top:25px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:12px}.head h2{margin:0;font-size:17px}.head p{margin:4px 0 0;color:var(--muted);font-size:10px}.courses{grid-template-columns:repeat(4,1fr)}.course{padding:17px;text-align:left;transition:.2s}.course:hover{transform:translateY(-3px);border-color:#315a77}.accent{width:64px;height:3px;border-radius:99px;margin-bottom:15px}.code{font:900 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:var(--muted)}.course h3{font-size:16px;margin:6px 0}.course p{font-size:10px;color:var(--muted);line-height:1.5;min-height:31px}.prow{display:flex;align-items:center;gap:8px;margin-top:14px}.bar{height:7px;flex:1;background:#071421;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:99px}.pct{font-size:10px;font-weight:950}.meta{display:flex;justify-content:space-between;color:#698095;font-size:9px;margin-top:9px}
.twocol{grid-template-columns:1.15fr .85fr}.focus{padding:4px}.focusitem{display:grid;grid-template-columns:31px 1fr auto;gap:10px;align-items:center;padding:11px;border-bottom:1px solid rgba(28,56,80,.6)}.focusitem:last-child{border-bottom:0}.num{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:rgba(73,216,231,.08);color:var(--cyan);font-size:10px;font-weight:950}.focusitem b{font-size:11px}.focusitem small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.heat{padding:15px}.heatgrid{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:13px}.day{height:31px;border-radius:7px;background:#081725;border:1px solid #132c40}.day.a{background:rgba(73,216,231,.18)}.day.b{background:rgba(73,216,231,.33)}.day.c{background:rgba(73,216,231,.55)}
.viewhead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.viewhead h1{font-size:29px;letter-spacing:-.035em;margin:0}.viewhead p{color:var(--muted);font-size:11px;line-height:1.6;max-width:700px}.detail{padding:23px;margin-bottom:15px}.detail h1{font-size:29px;margin:5px 0}.detail p{color:var(--muted);font-size:11px}.modules{display:grid;gap:10px}.module{overflow:hidden}.moduleMain{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;padding:15px}.week{width:48px;height:48px;border:1px solid #204059;border-radius:13px;background:#071522;display:grid;place-items:center;text-align:center}.week small{display:block;color:var(--muted);font-size:7px;text-transform:uppercase;font-weight:900}.week b{font-size:14px}.module h3{font-size:13px;margin:0}.module p{font-size:9px;color:var(--muted);line-height:1.5;margin:4px 0}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{border:1px solid #244258;background:#091826;color:#bed2df;border-radius:999px;padding:4px 7px;font-size:8px;font-weight:850}.moduleTools{border-top:1px solid var(--line);background:rgba(4,12,22,.3);padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap}.tool{border:1px solid var(--line);background:#091725;color:#dceaf1;border-radius:9px;padding:7px 9px;font-size:8px;font-weight:900}.tool.quiz{color:#c8fbff;border-color:rgba(73,216,231,.3);background:rgba(73,216,231,.07)}.status{border:1px solid var(--line);background:#081522;color:#b5c8d5;border-radius:9px;padding:7px 9px;font-size:8px;font-weight:900}.status.learning{color:#8ceaff}.status.review{color:var(--amber)}.status.mastered{color:var(--green);border-color:rgba(98,227,164,.25)}.dots{display:flex;gap:3px;margin-top:6px}.dot{width:10px;height:10px;border-radius:50%;border:1px solid #36556d;background:#071522;padding:0}.dot.on{background:var(--cyan);border-color:var(--cyan)}
.listgrid{grid-template-columns:repeat(2,1fr)}.item{padding:15px}.item h3{font-size:12px;margin:0 0 6px}.item p{font-size:9px;color:var(--muted);line-height:1.55;white-space:pre-wrap}.tiny{font-size:8px;color:#6d8498;margin-bottom:7px}.empty{text-align:center;padding:35px;border:1px dashed #284a63;border-radius:18px;color:var(--muted)}.empty b{display:block;color:#d9eaf3;font-size:12px;margin-bottom:5px}.empty p{font-size:9px;max-width:440px;margin:auto;line-height:1.6}.search{width:100%;border:1px solid #29465c;background:#071522;color:var(--text);border-radius:11px;padding:10px 11px;outline:none}.search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(73,216,231,.07)}
.modalbg{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,8,14,.75);backdrop-filter:blur(9px)}.modalbg.open{display:flex}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;border:1px solid #28506a;border-radius:21px;background:#0a1726;box-shadow:0 30px 100px rgba(0,0,0,.5)}.modalTop{position:sticky;top:0;background:rgba(10,23,38,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.modalTop h3{margin:0;font-size:14px}.modalTop button{border:0;background:transparent;color:var(--muted);font-size:20px}.modalBody{padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:900}.field input,.field textarea,.field select{border:1px solid #29465c;background:#071522;color:var(--text);border-radius:10px;padding:10px;outline:none}.field textarea{min-height:100px;resize:vertical}.learn{border:1px solid var(--line);background:#071522;border-radius:13px;padding:13px;margin-top:10px}.learn h4{margin:0 0 7px;font-size:11px}.learn p{font-size:9px;line-height:1.65;color:var(--muted)}.framework{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.framework div{border:1px solid #213f55;background:#0b1c2d;border-radius:9px;padding:8px;font-size:8px;font-weight:850}.framework span{display:block;color:var(--cyan);font-size:7px;margin-bottom:3px}.footer{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:#647b8f;font-size:8px;padding:28px 0 4px}.footer button{border:0;background:transparent;color:var(--cyan);font-size:8px}
.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#10263a;border:1px solid #315a77;border-radius:11px;padding:10px 13px;font-size:9px;font-weight:850;opacity:0;transform:translateY(60px);transition:.25s}.toast.show{opacity:1;transform:none}
.mobile{display:none}
@media(max-width:1050px){.courses,.stats{grid-template-columns:repeat(2,1fr)}.heroGrid,.twocol{grid-template-columns:1fr}}
@media(max-width:750px){.shell{display:block}.side{display:none}.top{height:62px;padding:0 13px}.wrap{padding:14px 11px 80px}.hero{padding:20px;border-radius:20px}.hero h1{font-size:35px}.stats,.courses,.twocol,.listgrid{grid-template-columns:1fr}.moduleMain{grid-template-columns:44px 1fr}.moduleMain>div:last-child{grid-column:1/-1;margin-left:56px}.week{width:43px;height:43px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.framework{grid-template-columns:1fr 1fr}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--line);background:rgba(6,16,28,.94);backdrop-filter:blur(14px);padding:6px 4px max(6px,env(safe-area-inset-bottom))}.mobile button{border:0;background:transparent;color:var(--muted);font-size:7px;font-weight:800;padding:6px}.mobile button b{display:block;font-size:15px;margin-bottom:2px}.mobile button.on{color:var(--cyan)}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><div class="logo">ECG</div><div><strong>PCP Mastery Hub</strong><small>Semester 3 • Mastery OS</small></div></div>
  <div class="nav" id="nav"></div>
  <div class="sidefoot"><b>Built to grow with the semester</b><p>Add each new lecture once. The dashboard, course progress, search and review system update with it.</p></div>
</aside>
<main class="main">
  <header class="top"><div><div class="kicker" id="kicker">Semester dashboard</div><div class="pagetitle" id="pagetitle">PCP Mastery Hub</div></div><div class="topright"><button class="btn" onclick="openSearch()">⌕ Search</button><button class="btn primary" onclick="openAdd()">＋ Add</button></div></header>
  <div class="wrap" id="view"></div>
</main>
</div>
<div class="mobile" id="mobile"></div>
<div class="modalbg" id="modalbg" onclick="if(event.target.id==='modalbg')closeModal()"><div class="modal"><div class="modalTop"><h3 id="mtitle">Panel</h3><button onclick="closeModal()">×</button></div><div class="modalBody" id="mbody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
var COURSES=[
{id:"pcth",code:"PCTH 308",title:"Patient Care Theory",sub:"ECG • rhythms • directives • clinical reasoning",accent:"#49d8e7",modules:[
{id:"pcth-w1-ecg",week:1,title:"Introduction to ECG",desc:"Build the ECG interpretation foundation.",topics:["ECG foundations"],modes:["learn","recall"]},
{id:"pcth-w1-sga",week:1,title:"Supraglottic Airway Medical Directive",desc:"Directive-focused airway study.",topics:["Airway","Medical directive"],modes:["learn","recall","apply"]},
{id:"pcth-w1-mca",week:1,title:"Medical Cardiac Arrest Medical Directive",desc:"Cardiac arrest directive study.",topics:["Cardiac arrest","Medical directive"],modes:["learn","recall","apply"]},
{id:"pcth-w2",week:2,title:"Sinus, Atrial, Junctional Rhythms & AV Blocks",desc:"Recognize rhythms by mechanism and prove every interpretation.",topics:["Sinus Rhythms","Junctional Rhythms","Atrial Rhythms","AVNRT / AVRT / WPW","AV Blocks"],modes:["learn","recall","quiz","apply"],quiz:"https://pcth-308-week-2-mastery-quiz.lovable.app",quizLabel:"89-Question Week 2 Mastery Quiz",framework:["Patient / pulse","Rate","Regularity","P waves","P:QRS relationship","PR behavior","QRS width","Mechanism","Name rhythm","Closest mimic"]}
]},
{id:"phrm",code:"PHRM 208",title:"Pharmacology",sub:"Standards • directives • medication reasoning",accent:"#6da8ff",modules:[
{id:"phrm-ca",week:"Current",title:"Cardiac Arrest Standard",desc:"Current study module.",topics:["Cardiac arrest"],modes:["learn","recall","apply"]},
{id:"phrm-mca",week:"Current",title:"Medical Cardiac Arrest Directives",desc:"Directive-focused study.",topics:["Medical directive"],modes:["learn","recall","apply"]},
{id:"phrm-tor",week:"Current",title:"Termination of Resuscitation (TOR)",desc:"TOR directive review and application.",topics:["TOR","Cardiac arrest"],modes:["learn","recall","apply"]}
]},
{id:"pclb",code:"PCLB 308",title:"Patient Care Lab",sub:"Scenarios • communication • assessment • debrief",accent:"#62e3a4",modules:[
{id:"pclb-scenarios",week:"Lab",title:"Scenario Practice Workspace",desc:"Assessment flow, clinical reasoning, communication, debrief and weak-point tracking.",topics:["Assessment flow","Clinical reasoning","Communication","Debrief"],modes:["learn","apply"]}
]},
{id:"resc",code:"RESC 108",title:"Research",sub:"Evidence • appraisal • research thinking",accent:"#b49dff",modules:[
{id:"resc-w1",week:1,title:"Evidence-Based Medicine, Paramedic Research, and Quality Improvement",desc:"Week 1 research foundations.",topics:["Evidence-based medicine","Research","Quality improvement","Study design","Appraisal"],modes:["learn","recall","apply"]}
]}];

var NAV=[["dashboard","⌂","Dashboard"],["courses","▦","Courses"],["weak","△","Weak Spots"],["resources","≡","Resources"],["notes","✎","My Notes"]];
var KEY="pcpMasteryHubLive.v1";
var state=load(),ui={view:"dashboard",course:null};
function fresh(){return{progress:{},weak:[],notes:[],custom:[],activity:{},last:null}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"{}");return Object.assign(fresh(),x)}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]})}
function courses(){return COURSES.map(function(c){var z=Object.assign({},c);z.modules=c.modules.concat(state.custom.filter(function(m){return m.courseId===c.id}));return z})}
function getCourse(cid){return courses().find(function(c){return c.id===cid})}
function getModule(mid){var cs=courses();for(var i=0;i<cs.length;i++){var m=cs[i].modules.find(function(x){return x.id===mid});if(m)return{course:cs[i],module:m}}}
function ps(mid){return state.progress[mid]||{status:"not-started",confidence:0,unknown:""}}
var SCORE={"not-started":0,learning:.35,review:.7,mastered:1},LABEL={"not-started":"Not Started",learning:"Learning",review:"Review",mastered:"Mastered"},ORDER=["not-started","learning","review","mastered"];
function mastery(c){if(!c.modules.length)return 0;return Math.round(c.modules.reduce(function(a,m){return a+SCORE[ps(m.id).status]},0)/c.modules.length*100)}
function overall(){var cs=courses();return Math.round(cs.reduce(function(a,c){return a+mastery(c)},0)/cs.length)}
function log(type,target){var d=new Date().toISOString().slice(0,10);state.activity[d]=(state.activity[d]||0)+1;state.last=target||state.last;save()}
function streak(){var d=new Date(),n=0,today=d.toISOString().slice(0,10);if(!state.activity[today])d.setDate(d.getDate()-1);while(state.activity[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n}
function nav(){var h=NAV.map(function(n){var on=ui.view===n[0]||(ui.view==="course"&&n[0]==="courses");return'<button class="'+(on?"on":"")+'" onclick="go(\\''+n[0]+'\\')"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join("");document.getElementById("nav").innerHTML=h;document.getElementById("mobile").innerHTML=NAV.map(function(n){var on=ui.view===n[0]||(ui.view==="course"&&n[0]==="courses");return'<button class="'+(on?"on":"")+'" onclick="go(\\''+n[0]+'\\')"><b>'+n[1]+'</b>'+n[2]+'</button>'}).join("")}
function setTitle(k,t){document.getElementById("kicker").textContent=k;document.getElementById("pagetitle").textContent=t}
function go(v,c){ui.view=v;ui.course=c||null;closeModal();render();scrollTo({top:0,behavior:"smooth"})}
function render(){nav();var v=document.getElementById("view");if(ui.view==="dashboard"){setTitle("Semester dashboard","PCP Mastery Hub");v.innerHTML=dash()}if(ui.view==="courses"){setTitle("Course map","Your courses");v.innerHTML=courseMap()}if(ui.view==="course"){var c=getCourse(ui.course);setTitle(c.code,c.title);v.innerHTML=coursePage(c)}if(ui.view==="weak"){setTitle("Adaptive review","Weak Spots");v.innerHTML=weakPage()}if(ui.view==="resources"){setTitle("Study library","Resources");v.innerHTML=resources()}if(ui.view==="notes"){setTitle("Quick capture","My Notes");v.innerHTML=notesPage()}}
function stat(l,n,s){return'<div class="card stat"><label>'+l+'</label><b>'+n+'</b><small>'+s+'</small></div>'}
function courseCard(c){var m=mastery(c);return'<button class="card course" onclick="go(\\'course\\',\\''+c.id+'\\')" style="color:inherit"><div class="accent" style="background:'+c.accent+';box-shadow:0 0 22px '+c.accent+'55"></div><div class="code">'+c.code+'</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.sub)+'</p><div class="prow"><div class="bar"><i style="width:'+m+'%"></i></div><span class="pct">'+m+'%</span></div><div class="meta"><span>'+c.modules.length+' modules</span><span>'+c.modules.filter(function(x){return ps(x.id).status==="mastered"}).length+' mastered</span></div></button>'}
function focus(){var a=[];state.weak.slice().sort(function(x,y){return(x.conf||1)-(y.conf||1)}).slice(0,2).forEach(function(w){a.push({t:w.concept,s:(w.courseCode||"Course")+" • weak spot • "+(w.conf||1)+"/5",b:"Review",a:"openWeak('"+w.id+"')"})});courses().forEach(function(c){c.modules.forEach(function(m){var p=ps(m.id);if(p.status!=="mastered")a.push({t:m.title,s:c.code+" • "+LABEL[p.status]+" • "+p.confidence+"/5",b:m.quiz?"Quiz":"Open",a:m.quiz?"window.open('"+m.quiz+"','_blank');log('quiz','"+m.id+"')":"openModule('"+m.id+"')"})})});return a.slice(0,3)}
function heat(){var h="",d=new Date();for(var i=13;i>=0;i--){var x=new Date(d);x.setDate(x.getDate()-i);var k=x.toISOString().slice(0,10),n=state.activity[k]||0;h+='<div class="day '+(n>=5?"c":n>=2?"b":n?"a":"")+'" title="'+k+': '+n+' actions"></div>'}return'<div class="card heat"><b style="font-size:11px">14-day study activity</b><div class="heatgrid">'+h+'</div></div>'}
function dash(){var cs=courses(),mods=cs.reduce(function(a,c){return a.concat(c.modules)},[]),f=focus();return'<section class="hero"><div class="heroGrid"><div><div class="eyebrow">Primary Care Paramedic • Semester 3</div><h1>Learn it. <em>Prove it.</em> Keep it.</h1><p>A single mastery system for your lectures, quizzes, directives, clinical reasoning, weak spots and notes. Every new week can slot into the same structure.</p><div class="actions"><button class="btn primary" onclick="'+(state.last&&getModule(state.last)?"openModule(\\'"+state.last+"\\')":"go(\\'courses\\')")+'">'+(state.last&&getModule(state.last)?"Continue studying":"Start studying")+'</button><button class="btn soft" onclick="window.open(\\'https://pcth-308-week-2-mastery-quiz.lovable.app\\',\\'_blank\\')">Week 2 ECG Quiz ↗</button><button class="btn" onclick="openAdd()">＋ Add module</button></div></div><div class="mission"><small>Today's focus</small><h3>'+(f[0]?esc(f[0].t):"Build momentum")+'</h3><p>'+(f[0]?esc(f[0].s):"Pick one module, retrieve it from memory, then test yourself.")+'</p>'+(f[0]?'<button class="btn soft" onclick="'+f[0].a+'">'+f[0].b+'</button>':"")+'</div></div></section><section class="grid stats">'+stat("Overall mastery",overall()+"%","Across all four courses")+stat("Study streak",streak()+" days","Actions logged on consecutive days")+stat("Weak concepts",state.weak.length,"Adaptive review queue")+stat("Mastered modules",mods.filter(function(m){return ps(m.id).status==="mastered"}).length+"/"+mods.length,"Keep moving modules forward")+'</section><section class="section"><div class="head"><div><h2>Your courses</h2><p>Progress changes as modules move from learning → review → mastered.</p></div><button class="btn" onclick="go(\\'courses\\')">View all</button></div><div class="grid courses">'+cs.map(courseCard).join("")+'</div></section><section class="section grid twocol"><div><div class="head"><div><h2>Focus queue</h2><p>Prioritized from unfinished and weak material.</p></div></div><div class="card focus">'+f.map(function(x,i){return'<div class="focusitem"><div class="num">0'+(i+1)+'</div><div><b>'+esc(x.t)+'</b><small>'+esc(x.s)+'</small></div><button class="btn" onclick="'+x.a+'">'+x.b+'</button></div>'}).join("")+'</div></div><div><div class="head"><div><h2>Consistency</h2><p>Small daily reps beat last-minute rereading.</p></div></div>'+heat()+'</div></section>'+footer()}
function courseMap(){return'<div class="viewhead"><div><h1>Course map</h1><p>Everything is module-based so each new lecture can drop in without rebuilding the site.</p></div><button class="btn primary" onclick="openAdd()">＋ Add personal module</button></div><div class="grid courses">'+courses().map(courseCard).join("")+'</div>'+footer()}
function moduleHtml(c,m){var p=ps(m.id),w=typeof m.week==="number"?m.week:m.week;return'<article class="card module"><div class="moduleMain"><div class="week"><div><small>'+(typeof m.week==="number"?"Week":"Module")+'</small><b>'+esc(w)+'</b></div></div><div><h3>'+esc(m.title)+'</h3><p>'+esc(m.desc)+'</p><div class="chips">'+(m.topics||[]).map(function(t){return'<span class="chip">'+esc(t)+'</span>'}).join("")+'</div></div><div><button class="status '+p.status+'" onclick="cycle(\\''+m.id+'\\')">'+LABEL[p.status]+'</button><div class="dots">'+[1,2,3,4,5].map(function(n){return'<button class="dot '+(n<=p.confidence?"on":"")+'" onclick="confidence(\\''+m.id+'\\','+n+')" title="Confidence '+n+'/5"></button>'}).join("")+'</div></div></div><div class="moduleTools"><button class="tool" onclick="openModule(\\''+m.id+'\\',\\'learn\\')">LEARN</button>'+(m.modes.indexOf("recall")>-1?'<button class="tool" onclick="openModule(\\''+m.id+'\\',\\'recall\\')">RECALL</button>':"")+(m.quiz?'<button class="tool quiz" onclick="window.open(\\''+m.quiz+'\\',\\'_blank\\');log(\\'quiz\\',\\''+m.id+'\\')">'+esc(m.quizLabel)+' ↗</button>':'<button class="tool" style="opacity:.35">QUIZ</button>')+(m.modes.indexOf("apply")>-1?'<button class="tool" onclick="openModule(\\''+m.id+'\\',\\'apply\\')">APPLY</button>':"")+'<button class="tool" onclick="addWeak(\\''+c.id+'\\',\\''+m.id+'\\')">＋ WEAK SPOT</button></div></article>'}
function coursePage(c){var m=mastery(c);return'<div class="card detail"><div class="code">'+c.code+'</div><h1>'+esc(c.title)+'</h1><p>'+esc(c.sub)+'</p><div class="prow" style="max-width:440px"><div class="bar"><i style="width:'+m+'%"></i></div><span class="pct">'+m+'% mastered</span></div></div><div class="head"><div><h2>Modules</h2><p>Open → actively retrieve → apply → rate confidence honestly.</p></div><button class="btn" onclick="openAdd(\\''+c.id+'\\')">＋ Add</button></div><div class="modules">'+c.modules.map(function(x){return moduleHtml(c,x)}).join("")+'</div><section class="section"><div class="card item" style="opacity:.6"><h3>Cumulative Exam Mode</h3><p>Add more weeks to build a broad final-exam bank across the whole course.</p></div></section>'+footer()}
function cycle(mid){var p=ps(mid),n=ORDER[(ORDER.indexOf(p.status)+1)%ORDER.length];state.progress[mid]=Object.assign({},p,{status:n});log("progress",mid);render();if(n==="mastered")say("Module marked Mastered ✓")}
function confidence(mid,n){var p=ps(mid);state.progress[mid]=Object.assign({},p,{confidence:n});log("confidence",mid);render();say("Confidence "+n+"/5")}
function openModule(mid,mode){mode=mode||"learn";var gm=getModule(mid);if(!gm)return;var m=gm.module,c=gm.course,p=ps(mid);log(mode,mid);var b='<div class="code">'+c.code+' • '+(typeof m.week==="number"?"Week "+m.week:m.week)+'</div><h2 style="font-size:24px;margin:6px 0">'+esc(m.title)+'</h2><p style="font-size:10px;color:var(--muted);line-height:1.7">'+esc(m.desc)+'</p><div class="chips">'+(m.topics||[]).map(function(t){return'<span class="chip">'+esc(t)+'</span>'}).join("")+'</div>';if(mode==="learn"){if(m.framework)b+='<div class="learn"><h4>ECG interpretation framework</h4><p>Do not jump straight to the rhythm name. Build the interpretation from evidence.</p><div class="framework">'+m.framework.map(function(x,i){return'<div><span>STEP '+(i+1)+'</span>'+esc(x)+'</div>'}).join("")+'</div></div>';else b+='<div class="learn"><h4>Learning slot ready</h4><p>When you add the lecture, this module can hold a full slide-by-slide review while keeping the same progress and weak spots.</p></div>';b+='<div class="learn"><h4>What I still do not know</h4><textarea class="search" style="min-height:85px" oninput="unknown(\\''+mid+'\\',this.value)" placeholder="Write the exact thing that still feels fuzzy…">'+esc(p.unknown)+'</textarea></div>'}if(mode==="recall")b+='<div class="empty"><b>Recall deck slot</b><p>This module is ready for flashcards and rapid retrieval practice when the lecture content is added.</p></div>';if(mode==="apply")b+='<div class="empty"><b>Application slot</b><p>This area is reserved for cases, rhythm discrimination, directive application and clinical reasoning.</p></div>';openModal(mode.toUpperCase()+" MODE",b)}
function unknown(mid,v){var p=ps(mid);state.progress[mid]=Object.assign({},p,{unknown:v});save()}
function weakPage(){var a=state.weak.slice().sort(function(x,y){return(x.conf||1)-(y.conf||1)});return'<div class="viewhead"><div><h1>Weak Spots</h1><p>Save uncertainty immediately. This becomes your adaptive review queue instead of letting weak concepts disappear into your notes.</p></div><button class="btn primary" onclick="weakForm()">＋ Add weak spot</button></div>'+(a.length?'<div class="grid listgrid">'+a.map(function(w){return'<div class="card item"><div class="tiny">'+esc(w.courseCode)+' • confidence '+(w.conf||1)+'/5</div><h3>'+esc(w.concept)+'</h3><p>'+esc(w.notes||"No notes yet.")+'</p><div class="actions"><button class="btn soft" onclick="openWeak(\\''+w.id+'\\')">Review</button><button class="btn" onclick="improve(\\''+w.id+'\\')">Mark improved</button><button class="btn danger" onclick="removeWeak(\\''+w.id+'\\')">Remove</button></div></div>'}).join("")+'</div>':'<div class="empty"><b>No weak spots saved yet</b><p>When something makes you hesitate in lecture, on a quiz, or in a scenario, add it here.</p></div>')+footer()}
function addWeak(cid,mid){var gm=getModule(mid);weakForm({courseId:cid,moduleId:mid,concept:gm.module.title,conf:ps(mid).confidence||1})}
function weakForm(seed){seed=seed||{};openModal("ADD WEAK SPOT",'<div class="fields"><div class="field"><label>Course</label><select id="wc">'+courses().map(function(c){return'<option value="'+c.id+'" '+(seed.courseId===c.id?"selected":"")+'>'+c.code+'</option>'}).join("")+'</select></div><div class="field"><label>Confidence 1–5</label><select id="wf">'+[1,2,3,4,5].map(function(n){return'<option '+(seed.conf===n?"selected":"")+'>'+n+'</option>'}).join("")+'</select></div><div class="field full"><label>Concept</label><input id="wconcept" value="'+esc(seed.concept||"")+'" placeholder="e.g. Mobitz I vs Mobitz II"></div><div class="field full"><label>What is confusing?</label><textarea id="wnotes" placeholder="What would make you hesitate on a test or scenario?"></textarea></div></div><div class="actions"><button class="btn primary" onclick="saveWeak(\\''+(seed.moduleId||"")+'\\')">Save weak spot</button></div>')}
function saveWeak(mid){var cid=document.getElementById("wc").value,c=getCourse(cid),concept=document.getElementById("wconcept").value.trim();if(!concept)return say("Add a concept first");state.weak.push({id:id(),courseId:cid,courseCode:c.code,moduleId:mid,concept:concept,conf:+document.getElementById("wf").value,notes:document.getElementById("wnotes").value.trim()});log("weak",mid||cid);closeModal();render();say("Weak spot added")}
function openWeak(wid){var w=state.weak.find(function(x){return x.id===wid});if(!w)return;openModal("WEAK SPOT",'<div class="code">'+esc(w.courseCode)+' • confidence '+w.conf+'/5</div><h2 style="font-size:24px;margin:7px 0">'+esc(w.concept)+'</h2><p style="font-size:10px;color:var(--muted);line-height:1.7">'+esc(w.notes||"No notes yet.")+'</p><div class="actions"><button class="btn primary" onclick="improve(\\''+w.id+'\\')">Mark improved</button></div>')}
function improve(wid){var w=state.weak.find(function(x){return x.id===wid});if(w){w.conf=Math.min(5,(w.conf||1)+1);log("review",w.moduleId||w.courseId);closeModal();render();say("Confidence increased")}}
function removeWeak(wid){state.weak=state.weak.filter(function(x){return x.id!==wid});save();render()}
function notesPage(){return'<div class="viewhead"><div><h1>My Notes</h1><p>Capture instructor wording, questions, exam traps, scenario feedback and anything you need to revisit.</p></div><button class="btn primary" onclick="noteForm()">＋ New note</button></div><input class="search" placeholder="Filter notes…" oninput="filterNotes(this.value)" style="margin-bottom:12px"><div id="notelist">'+noteList()+'</div>'+footer()}
function noteList(){return state.notes.length?'<div class="grid listgrid">'+state.notes.map(function(n){return'<div class="card item note" data-s="'+esc((n.title+" "+n.body+" "+n.courseCode+" "+(n.tag||"")).toLowerCase())+'"><div class="tiny">'+esc(n.courseCode||"General")+(n.tag?" • #"+esc(n.tag):"")+'</div><h3>'+esc(n.title)+'</h3><p>'+esc(n.body)+'</p><div class="actions"><button class="btn danger" onclick="deleteNote(\\''+n.id+'\\')">Delete</button></div></div>'}).join("")+'</div>':'<div class="empty"><b>No notes yet</b><p>Use quick notes for instructor comments, test wording, questions and things to review later.</p></div>'}
function filterNotes(q){q=q.toLowerCase();document.querySelectorAll(".note").forEach(function(x){x.style.display=x.dataset.s.indexOf(q)>-1?"":"none"})}
function noteForm(){openModal("QUICK NOTE",'<div class="fields"><div class="field"><label>Course</label><select id="nc"><option value="">General</option>'+courses().map(function(c){return'<option value="'+c.id+'">'+c.code+'</option>'}).join("")+'</select></div><div class="field"><label>Tag</label><input id="ntag" placeholder="wording, exam, scenario…"></div><div class="field full"><label>Title</label><input id="ntitle" placeholder="What do you need to remember?"></div><div class="field full"><label>Note</label><textarea id="nbody" placeholder="Write it while it is fresh…"></textarea></div></div><div class="actions"><button class="btn primary" onclick="saveNote()">Save note</button></div>')}
function saveNote(){var t=document.getElementById("ntitle").value.trim(),b=document.getElementById("nbody").value.trim(),cid=document.getElementById("nc").value,c=cid?getCourse(cid):null;if(!t&&!b)return say("Add a note first");state.notes.unshift({id:id(),courseId:cid,courseCode:c?c.code:"General",title:t||"Untitled note",body:b,tag:document.getElementById("ntag").value.trim()});log("note",cid||"general");closeModal();render();say("Note saved")}
function deleteNote(nid){state.notes=state.notes.filter(function(x){return x.id!==nid});save();render()}
function resources(){var a=[];courses().forEach(function(c){c.modules.forEach(function(m){if(m.quiz)a.push({c:c,m:m,label:m.quizLabel,url:m.quiz})})});return'<div class="viewhead"><div><h1>Resources</h1><p>Module-linked quizzes and study tools collect here automatically.</p></div></div><div class="grid listgrid">'+a.map(function(r){return'<a class="card item" target="_blank" rel="noopener" href="'+r.url+'"><div class="tiny">'+r.c.code+' • Mastery Quiz</div><h3>'+esc(r.label)+'</h3><p>'+esc(r.m.title)+'</p><div class="actions"><span class="btn soft">Open ↗</span></div></a>'}).join("")+'</div>'+footer()}
function openAdd(prefill){openModal("ADD PERSONAL MODULE",'<p style="font-size:9px;color:var(--muted);line-height:1.6">Add a module instantly on this device. Shared semester content can be added permanently when you give ChatGPT the next lecture.</p><div class="fields"><div class="field"><label>Course</label><select id="ac">'+courses().map(function(c){return'<option value="'+c.id+'" '+(prefill===c.id?"selected":"")+'>'+c.code+'</option>'}).join("")+'</select></div><div class="field"><label>Week / label</label><input id="aw" placeholder="3 or Current"></div><div class="field full"><label>Title</label><input id="at" placeholder="Lecture / directive / topic"></div><div class="field full"><label>Description</label><textarea id="ad" style="min-height:75px"></textarea></div><div class="field full"><label>Topics (comma separated)</label><input id="atop" placeholder="Topic A, Topic B"></div><div class="field full"><label>Quiz/resource URL (optional)</label><input id="au" placeholder="https://…"></div></div><div class="actions"><button class="btn primary" onclick="saveCustom()">Add module</button></div>')}
function saveCustom(){var t=document.getElementById("at").value.trim();if(!t)return say("Add a title");var w=document.getElementById("aw").value.trim(),u=document.getElementById("au").value.trim();state.custom.push({id:"custom-"+id(),courseId:document.getElementById("ac").value,week:/^\\d+$/.test(w)?+w:(w||"Custom"),title:t,desc:document.getElementById("ad").value.trim(),topics:document.getElementById("atop").value.split(",").map(function(x){return x.trim()}).filter(Boolean),modes:["learn","recall","apply"].concat(u?["quiz"]:[]),quiz:u||null,quizLabel:u?"Open study tool":null});log("add","custom");closeModal();render();say("Module added")}
function openSearch(){var rows=[];courses().forEach(function(c){rows.push({t:c.code+" — "+c.title,s:"Course",a:"go('course','"+c.id+"')"});c.modules.forEach(function(m){rows.push({t:m.title,s:c.code+" • "+m.week,a:"openModule('"+m.id+"')",k:(m.topics||[]).join(" ")})})});state.notes.forEach(function(n){rows.push({t:n.title,s:"Note • "+n.courseCode,a:"go('notes')",k:n.body})});openModal("SEARCH",'<input id="sq" class="search" placeholder="Search modules, topics and notes…" oninput="searchNow()" autofocus><div id="sres" style="margin-top:10px"></div>');window._rows=rows;searchNow()}
function searchNow(){var q=(document.getElementById("sq")?document.getElementById("sq").value:"").toLowerCase(),a=(window._rows||[]).filter(function(x){return(x.t+" "+x.s+" "+(x.k||"")).toLowerCase().indexOf(q)>-1}).slice(0,18);document.getElementById("sres").innerHTML=a.map(function(x){return'<div class="card item" style="margin-bottom:6px;cursor:pointer" onclick="'+x.a+';closeModal()"><h3>'+esc(x.t)+'</h3><div class="tiny">'+esc(x.s)+'</div></div>'}).join("")}
function openModal(t,b){document.getElementById("mtitle").textContent=t;document.getElementById("mbody").innerHTML=b;document.getElementById("modalbg").classList.add("open")}
function closeModal(){document.getElementById("modalbg").classList.remove("open")}
function footer(){return'<footer class="footer"><span>Educational study tool • Current Ontario BLS/ALS standards, medical directives, scope and medical control remain the clinical source of truth.</span><button onclick="openAdd()">Add more semester content →</button></footer>'}
function say(s){var t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000)}
document.addEventListener("keydown",function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch()}if(e.key==="Escape")closeModal()});
render();
</script>
</body>
</html>
