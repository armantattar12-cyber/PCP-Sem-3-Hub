id:"pcth",code:"PCTH 308",name:"Patient Care Theory",accent:"#4ad8e7",summary:"ECG foundations, rhythm recognition, conduction concepts and class-linked study tools.",status:"ready",
modules:[
{
id:"pcth1",week:"1",title:"Introduction to ECG",desc:"Cardiac cells, autonomic effects, action potentials, refractory periods, conduction system, ECG paper, leads, and a systematic approach.",
topics:["Cardiac cells","Autonomic nervous system","Action potential","Conduction system","ECG basics"],
source:"https://drive.google.com/file/d/1YsH8zsMnARk5Z28u9g8UVnoF4ACxXx_g/view",
content:'<div class="studyBox"><h4>What Week 1 is building</h4><p>This is the foundation for every rhythm lecture that follows. Before naming a rhythm, understand <strong>how the electrical impulse is generated</strong>, how it travels through the heart, and how that activity appears on ECG paper.</p><div class="studyColumns"><div class="fact"><b>Automaticity</b><span>Ability of pacemaker cells to generate an impulse without an outside nerve triggering every beat.</span></div><div class="fact"><b>Excitability</b><span>Ability of a cardiac cell to respond to a chemical, mechanical, or electrical stimulus.</span></div><div class="fact"><b>Conductivity</b><span>Ability to receive an electrical impulse and pass it to adjacent cardiac cells.</span></div><div class="fact"><b>Contractility</b><span>Ability of myocardial cells to shorten and create force after electrical stimulation.</span></div><div class="fact"><b>Refractoriness</b><span>Recovery period after depolarization before the cell can respond normally again.</span></div><div class="fact"><b>Pacemaker hierarchy</b><span>SA node about 60–100/min → AV junction about 40–60/min → ventricular/Purkinje backup about 20–40/min.</span></div></div><h4>Autonomic effects</h4><p><strong>Sympathetic:</strong> generally increases heart rate, AV conduction and contractile force. <strong>Parasympathetic/vagal:</strong> generally slows heart rate and AV-nodal conduction.</p><div class="studyColumns"><div class="fact"><b>Chronotropy</b><span>Change in heart rate.</span></div><div class="fact"><b>Inotropy</b><span>Change in myocardial contractile force.</span></div><div class="fact"><b>Dromotropy</b><span>Change in conduction speed, especially through the AV junction.</span></div><div class="fact"><b>ECG ≠ mechanical output</b><span>The ECG records electrical activity. It does not directly prove effective contraction, pulse, or cardiac output.</span></div></div><h4>Action potential logic</h4><ul><li><strong>Depolarization:</strong> electrical activation of the cell.</li><li><strong>Repolarization:</strong> recovery toward the resting electrical state.</li><li><strong>Absolute refractory period:</strong> the cell cannot be stimulated to depolarize again.</li><li><strong>Relative refractory period:</strong> a strong enough stimulus may trigger depolarization, making this a vulnerable period.</li></ul><h4>Conduction sequence</h4><p><strong>SA node → atria → AV node/junction → Bundle of His → right/left bundle branches → Purkinje fibres → ventricular myocardium.</strong></p><div class="callout"><strong>AV-node purpose:</strong> it delays conduction long enough to help the atria finish emptying into the ventricles before ventricular contraction.</div><h4>ECG paper</h4><div class="studyColumns"><div class="fact"><b>Horizontal = time</b><span>1 small box = 0.04 s. 1 large box = 0.20 s. 5 large boxes = 1 second. 30 large boxes = 6 seconds.</span></div><div class="fact"><b>Vertical = voltage/amplitude</b><span>Electrical amplitude is plotted vertically. Current moving toward a positive electrode tends to create a positive/upward deflection.</span></div></div><h4>Basic ECG approach</h4><div class="framework"><div class="step"><em>1</em>P waves</div><div class="step"><em>2</em>PR interval</div><div class="step"><em>3</em>QRS</div><div class="step"><em>4</em>Regularity</div><div class="step"><em>5</em>Rate</div><div class="step"><em>6</em>Interpretation</div></div><div class="sourceRow"><a class="btn soft" target="_blank" rel="noopener" href="https://drive.google.com/file/d/1YsH8zsMnARk5Z28u9g8UVnoF4ACxXx_g/view">Open source lecture ↗</a></div></div>'
},
{
id:"pcth2",week:"2",title:"Sinus, Atrial, Junctional Rhythms & AV Blocks",desc:"Sinus rhythms, junctional rhythms, premature atrial beats, AF/flutter, SVT mechanisms, WPW, and AV block recognition.",
topics:["Sinus rhythms","Junctional rhythms","Atrial rhythms","SVT","WPW","AV blocks"],
source:"https://drive.google.com/file/d/1lTGgvfqO1SVfwkHz4teimKs7_ExNFixN/view",
review:"https://docs.google.com/document/d/1JN-iDVnzX6Cod1tN_bO98N7GCIxI_8pyOEvMzeL7PCw/edit",
quiz:"https://pcth-308-week-2-mastery-quiz.lovable.app",
content:'<div class="studyBox"><h4>How to solve Week 2 rhythms</h4><p>Do not jump straight to a rhythm name. Build the interpretation from evidence: where the impulse starts, whether it reaches the ventricles normally, and what pattern that creates.</p><div class="framework"><div class="step"><em>1</em>Patient / pulse</div><div class="step"><em>2</em>Rate</div><div class="step"><em>3</em>Regularity</div><div class="step"><em>4</em>P waves</div><div class="step"><em>5</em>P:QRS</div><div class="step"><em>6</em>PR behaviour</div><div class="step"><em>7</em>QRS width</div><div class="step"><em>8</em>Mechanism</div><div class="step"><em>9</em>Name rhythm</div><div class="step"><em>10</em>Closest mimic</div></div><h4>Sinus rhythms</h4><div class="studyColumns"><div class="fact"><b>Normal sinus rhythm</b><span>60–100/min, regular, sinus P before each QRS, PR 0.12–0.20 s and constant, narrow QRS.</span></div><div class="fact"><b>Sinus bradycardia</b><span>Same sinus pattern, rate below 60. Clinical concern depends on perfusion and symptoms, not the number alone.</span></div><div class="fact"><b>Sinus tachycardia</b><span>Same sinus origin, rate above 100. Ask what physiologic stress or demand is driving the SA node.</span></div><div class="fact"><b>Sinus arrhythmia</b><span>Sinus P waves remain consistent, but R–R intervals vary, commonly with respiration.</span></div><div class="fact"><b>SA exit block</b><span>The impulse is generated but fails to exit the SA node. The pause tends to be a multiple of the basic P–P cycle.</span></div><div class="fact"><b>Sinus arrest</b><span>The SA node fails to generate the expected impulse. The pause does not cleanly match a multiple of the preceding P–P interval.</span></div></div><h4>Junctional rhythms</h4><ul><li><strong>PJC:</strong> premature junctional beat; P wave may be absent, inverted, before, buried in, or after the QRS.</li><li><strong>Junctional escape:</strong> a late protective beat after a higher pacemaker fails.</li><li><strong>Junctional escape rhythm:</strong> typically around 40–60/min.</li><li><strong>Accelerated junctional rhythm:</strong> junctional rhythm around 60–100/min.</li><li><strong>Junctional tachycardia:</strong> junctional rhythm above 100/min.</li></ul><h4>Atrial rhythms</h4><div class="studyColumns"><div class="fact"><b>PAC</b><span>Premature atrial impulse. P shape may differ or be buried in the preceding T wave; QRS is usually narrow.</span></div><div class="fact"><b>Atrial fibrillation</b><span>No organized P waves, irregularly irregular ventricular rhythm, fibrillatory baseline. Rapid AF has ventricular rate above 100.</span></div><div class="fact"><b>Atrial flutter</b><span>Rapid organized atrial re-entry, usually around 250–350/min, with characteristic flutter waves. Common ratios: 2:1 ≈ 150, 3:1 ≈ 100, 4:1 ≈ 75.</span></div><div class="fact"><b>WAP vs MAT</b><span>Both have at least 3 P-wave morphologies. WAP is below 100/min; MAT is 100/min or faster.</span></div></div><h4>SVT / re-entry</h4><p><strong>AVNRT</strong> uses a re-entry circuit within/around the AV node. <strong>AVRT</strong> uses an accessory pathway outside the AV node. In <strong>WPW</strong>, classic manifest pre-excitation produces a short PR, delta wave and widened QRS.</p><h4>AV blocks</h4><div class="studyColumns"><div class="fact"><b>1st degree</b><span>Every P conducts, but PR is prolonged beyond 0.20 s and remains constant.</span></div><div class="fact"><b>Mobitz I / Wenckebach</b><span>PR progressively lengthens until a P wave is not followed by a QRS, then the cycle resets.</span></div><div class="fact"><b>Mobitz II</b><span>Conducted beats have constant PR intervals, with intermittent non-conducted P waves/dropped QRS complexes.</span></div><div class="fact"><b>3rd degree</b><span>Complete AV dissociation: atria and ventricles beat independently because atrial impulses do not conduct to the ventricles.</span></div></div><div class="callout"><strong>Important:</strong> a complete heart block is not automatically PEA. PEA means organized electrical activity without a palpable pulse — that requires a clinical pulse/perfusion assessment.</div><div class="sourceRow"><a class="btn soft" target="_blank" rel="noopener" href="https://drive.google.com/file/d/1lTGgvfqO1SVfwkHz4teimKs7_ExNFixN/view">Open source lecture ↗</a><a class="btn" target="_blank" rel="noopener" href="https://docs.google.com/document/d/1JN-iDVnzX6Cod1tN_bO98N7GCIxI_8pyOEvMzeL7PCw/edit">Open complete Week 2 review ↗</a><a class="btn primary" target="_blank" rel="noopener" href="https://pcth-308-week-2-mastery-quiz.lovable.app">89-question mastery quiz ↗</a></div></div>'
}
]

{
id:"phrm",code:"PHRM 208",name:"Pharmacology",accent:"#6da8ff",summary:"Week 1 airway and cardiac-arrest directives, resuscitation updates, and directive-linked concepts.",status:"ready",
modules:[
{
id:"phrm-sga",week:"1",title:"Supraglottic Airway Medical Directive",desc:"I-GEL, directive structure, contraindications, attempt limits, confirmation, and ventilation integration.",
topics:["I-GEL","Airway","Medical directive","Ventilation"],
source:"https://drive.google.com/file/d/1mvMgCfXVYPz8Z9-bwChxcoMYxBuCUswX/view",
content:'<div class="studyBox"><h4>What this lecture is about</h4><p>The lecture introduces the <strong>Supraglottic Airway Medical Directive</strong>, the I-GEL device, relevant ALS PCS wording, and the Companion Document. Your goal is not just to know what an SGA is — it is to know <strong>when the directive applies, what limits exist, and how you confirm effective placement and ventilation.</strong></p><div class="studyColumns"><div class="fact"><b>Purpose of an SGA</b><span>A supraglottic airway sits above the glottic opening and can provide a more secure ventilation route when a patient cannot maintain/protect their airway.</span></div><div class="fact"><b>I-GEL</b><span>The Week 1 lecture uses the I-GEL as the SGA device example.</span></div><div class="fact"><b>Attempt limit</b><span>The lecture highlights a maximum of 2 attempts. Know the exact directive wording from the current ALS PCS/Companion Document.</span></div><div class="fact"><b>Confirmation</b><span>Placement must be confirmed using the methods required by the directive/standards; capnography and effective ventilation assessment are central clinical tools.</span></div></div><h4>Ventilation integration in cardiac arrest</h4><ul><li>With an advanced airway in place, chest compressions can continue without pausing for a 30:2 cycle.</li><li>The lecture lists adult ventilation at approximately <strong>1 breath every 6 seconds</strong>.</li><li>The lecture lists pediatric ventilation at approximately <strong>1 breath every 3 seconds</strong>.</li><li>Avoid hyperventilation and ventilate only enough to produce visible chest rise.</li></ul><div class="callout"><strong>Test strategy:</strong> directives are often tested on exact wording, contraindications, attempt limits, and considerations. Use the current ALS PCS and Companion Document as the clinical source of truth.</div><div class="sourceRow"><a class="btn soft" target="_blank" rel="noopener" href="https://drive.google.com/file/d/1mvMgCfXVYPz8Z9-bwChxcoMYxBuCUswX/view">Open source lecture ↗</a></div></div>'
},
{
id:"phrm-mca",week:"1",title:"Medical Cardiac Arrest Medical Directive",desc:"Cardiac-arrest rhythm recognition, CPR/ventilation updates, pediatric bradycardia, special considerations, DNR and directive review.",
topics:["Cardiac arrest","VF/VT","PEA","Asystole","DNR","CPR","Ventilation"],
source:"https://drive.google.com/file/d/1ZRIvDjlCP_3ih5PzIT6lmhjdzLMIah6f/view",
content:'<div class="studyBox"><h4>Core cardiac-arrest model</h4><p>Before treatment decisions, separate <strong>pulse status</strong> from the electrical rhythm. A rhythm can look organized and still have no pulse.</p><div class="studyColumns"><div class="fact"><b>VF</b><span>Chaotic ventricular electrical activity with no effective organized ventricular contraction. In cardiac arrest, VF is shockable.</span></div><div class="fact"><b>Pulseless VT</b><span>Wide-complex ventricular tachycardia with no pulse. In cardiac arrest, pulseless VT is shockable.</span></div><div class="fact"><b>Asystole</b><span>Absence of meaningful ventricular electrical activity. It is non-shockable.</span></div><div class="fact"><b>PEA</b><span>Organized electrical activity on the monitor without a palpable pulse. It is a clinical state, not one specific ECG rhythm, and is non-shockable.</span></div></div><div class="callout"><strong>Simple rule:</strong> pulseless VF/VT = shockable. Asystole and PEA = non-shockable. VT with a pulse is not cardiac arrest and is managed differently.</div><h4>CPR / airway updates highlighted in the lecture</h4><ul><li>Ventilate only until visible chest rise and deliver each breath over about 1 second.</li><li>Avoid hyperventilation because it can worsen hemodynamics and increase gastric insufflation/aspiration risk.</li><li>The lecture emphasizes a two-handed mask seal with one rescuer focused on the airway where staffing permits.</li><li>For infant CPR, the lecture notes updated preferred compression techniques rather than the traditional two-finger method.</li><li>For choking in adults/children, the lecture notes alternating back blows and abdominal thrusts.</li></ul><h4>Pediatric symptomatic bradycardia</h4><p>The lecture emphasizes <strong>HR &lt; 60/min with cardiopulmonary compromise</strong>, immediate correction of causes, and optimization of airway, oxygenation and ventilation. If significant bradycardia with compromise persists despite effective oxygenation/ventilation, CPR is initiated.</p><h4>Special situations highlighted</h4><ul><li><strong>Pregnancy ≥20 weeks:</strong> early transport consideration, high-quality CPR, early defibrillation when indicated, and manual uterine displacement.</li><li><strong>Suspected opioid-related cardiac arrest:</strong> the lecture highlights uncertain evidence for naloxone during established cardiac arrest; standard resuscitation priorities remain central.</li><li><strong>Reversible causes:</strong> think hypoxia, hypovolemia, electrolyte/metabolic problems, hypothermia, tension pneumothorax, tamponade, thrombosis, toxins, and other treatable causes.</li><li><strong>DNR:</strong> DNR means do not initiate resuscitation when the legal requirements are met; it is not the same as “do not treat.”</li></ul><h4>TOR</h4><p>The lecture links termination-of-resuscitation decisions to the medical directive and broader clinical context. Memorize the <strong>current directive criteria and exact wording</strong> from the ALS PCS and Companion Document rather than relying only on a summary.</p><div class="sourceRow"><a class="btn soft" target="_blank" rel="noopener" href="https://drive.google.com/file/d/1ZRIvDjlCP_3ih5PzIT6lmhjdzLMIah6f/view">Open source lecture ↗</a></div></div>'
}
]

function course(id){return COURSES.find(function(c){return c.id===id})}
function classCard(c){
  return '<button class="card classCard" onclick="go(\\''+c.id+'\\')" style="color:inherit"><div class="stripe" style="background:'+c.accent+';box-shadow:0 0 20px '+c.accent+'55"></div><div class="code">'+c.code+'</div><h3>'+c.name+'</h3><p>'+c.summary+'</p><div class="classMeta"><span class="status '+(c.status==="ready"?"ready":"next")+'">'+(c.status==="ready"?"CONTENT STARTED":"READY TO BUILD")+'</span><span>'+(c.modules?c.modules.length:0)+' modules</span></div></button>';
}
function home(){
  var cs=COURSES.filter(function(c){return c.id!=="home"});
  return '<section class="hero"><div class="eyebrow">Primary Care Paramedic • Semester 3</div><h1>PCP <span>Sem 3 Hub</span></h1><p>Start with the classes. Keep each course clean, organized, and easy to expand. PCTH and PHRM are populated first from your actual lecture material; PCLB and RESC stay uncluttered until their content is added.</p><div class="heroActions"><button class="btn primary" onclick="go(\\'pcth\\')">Open PCTH</button><button class="btn soft" onclick="go(\\'phrm\\')">Open PHRM</button></div></section><section class="section"><div class="sectionHead"><div><h2>Your classes</h2><p>One home for each course. New weeks will slot into the correct class as the semester moves forward.</p></div></div><div class="grid classes">'+cs.map(classCard).join("")+'</div></section><footer class="footer">Study site only — current Ontario BLS/ALS standards, medical directives, scope and medical control remain the clinical source of truth.</footer>';
}
function moduleCard(c,m){
  var links='<button class="mode" onclick="toggle(\\''+m.id+'\\')">LEARN / REVIEW</button>';
  if(m.quiz)links+='<a class="mode quiz" target="_blank" rel="noopener" href="'+m.quiz+'">MASTERY QUIZ ↗</a>';
  links+='<a class="mode" target="_blank" rel="noopener" href="'+m.source+'">SOURCE LECTURE ↗</a>';
  if(m.review)links+='<a class="mode" target="_blank" rel="noopener" href="'+m.review+'">COMPLETE REVIEW ↗</a>';
  return '<article class="card module"><div class="moduleTop"><div class="week"><div><small>Week</small><b>'+m.week+'</b></div></div><div><h3>'+m.title+'</h3><p>'+m.desc+'</p><div class="chips">'+m.topics.map(function(t){return '<span class="chip">'+t+'</span>'}).join("")+'</div></div><div class="moduleAction"><span class="status ready">CONTENT</span></div></div><div class="moduleFoot">'+links+'</div><div class="studyPanel" id="'+m.id+'">'+m.content+'</div></article>';
}
function coursePage(c){
  var body='<div class="card courseHero"><div class="code">'+c.code+'</div><h1>'+c.name+'</h1><p>'+c.summary+'</p><div class="rows"><span class="status '+(c.status==="ready"?"ready":"next")+'">'+(c.status==="ready"?"CONTENT STARTED":"ORGANIZED — CONTENT NEXT")+'</span></div></div>';
  if(c.modules&&c.modules.length){
    body+='<div class="sectionHead"><div><h2>Course content</h2><p>Weeks are kept in order. Open the learning review or jump straight to the original lecture.</p></div></div><div class="moduleList">'+c.modules.map(function(m){return moduleCard(c,m)}).join("")+'</div>';
  }else{
    body+='<div class="empty"><b>'+c.code+' is organized and ready.</b><p>I am leaving this class clean for now instead of filling it with guessed material. When you add the first lecture, it will appear here as Week 1 with its review and study tools.</p></div>';
  }
  body+='<footer class="footer">PCP Sem 3 Hub • Class content expands week by week.</footer>';
  return body;
}
function toggle(id){var el=document.getElementById(id);if(el)el.classList.toggle("open")}
function render(){nav();document.getElementById("app").innerHTML=current==="home"?home():coursePage(course(current))}
render();
</script>
</body>
</html>
